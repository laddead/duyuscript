<!DOCTYPE html>
<html lang="vi"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DuyuScript</title>
<meta name="description" content="DuyuScript - kho script Roblox cập nhật liên tục.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net/" crossorigin="">
<link rel="preconnect" href="https://raw.githubusercontent.com/" crossorigin="">
<link rel="preconnect" href="https://i.ibb.co/" crossorigin="">
<link rel="preconnect" href="https://wsrv.nl/" crossorigin="">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net/">
<link rel="dns-prefetch" href="https://raw.githubusercontent.com/">
<link rel="dns-prefetch" href="https://i.ibb.co/">
<link rel="dns-prefetch" href="https://wsrv.nl/">
<!-- Font Fredoka giống phong cách hoạt hình -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #7eb0d5;
  --surface: #fcf8eb;
  --surface-2: #e8dfc8;
  --surface-hover: #ffffff;
  --border-color: #3b3b3b;
  --text-main: #2b2b2b;
  --text-sub: #555555;
  --text-dim: #888888;
  --accent-yellow: #ffca3a;
  --accent-green: #5cb85c;
  --radius: 12px;
  --shadow-hard: 4px 4px 0px rgba(0,0,0,0.15);
  --shadow-btn: 0 4px 0px var(--border-color);
}

* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0;
  background-color: var(--bg-base);
  background-image: 
    linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 40px 40px;
  color: var(--text-main);
  font-family: 'Fredoka', system-ui, sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
  -webkit-font-smoothing: antialiased;
}

.header-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 20px 10px 20px;
  max-width: 460px;
  margin: 0 auto;
}

/* ===== Ảnh ủng hộ ad (góc trên bên phải, kế avatar) ===== */
.support-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 108px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  z-index: 20;
  animation: badgeFloat 2.8s ease-in-out infinite;
}

@keyframes badgeFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.support-badge img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
  border-radius: 12px;
  border: 3px solid var(--border-color);
  box-shadow: var(--shadow-hard);
  background: #fff;
}

.support-badge .support-text {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.25;
  text-align: center;
  color: #ffffff;
  background: #e63946;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  padding: 3px 6px;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  text-shadow: 1px 1px 0 rgba(0,0,0,0.35);
}

.avatar-wrapper {
  position: relative;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border: 4px solid var(--border-color);
  box-shadow: var(--shadow-hard);
  padding: 2px;
  margin-bottom: 12px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.avatar-wrapper.playing { animation: musicPulse 1.2s infinite alternate ease-in-out; }

@keyframes musicPulse {
  0% { transform: scale(1); box-shadow: var(--shadow-hard); }
  100% { transform: scale(1.05); box-shadow: 0 6px 0px rgba(0,0,0,0.2); border-color: var(--accent-yellow); }
}

.avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

.profile-name {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent-yellow);
  text-shadow: 2px 2px 0 #333, -1px -1px 0 #333, 1px -1px 0 #333, -1px 1px 0 #333, 1px 1px 0 #333;
  margin-bottom: 16px;
  letter-spacing: 1px;
}

.audio-player-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #333;
  border: 3px solid var(--border-color);
  border-radius: 30px;
  padding: 8px 18px;
  width: 100%;
  max-width: 320px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-hard);
  cursor: pointer;
  user-select: none;
  transition: transform 0.1s;
}
.audio-player-card:active { transform: translateY(4px); box-shadow: none; }

.play-icon-badge {
  background: var(--accent-green);
  border: 2px solid var(--border-color);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  color: white;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 0 var(--border-color);
}

.audio-info { display: flex; flex-direction: column; flex: 1; margin: 0 12px; }
.audio-title { font-size: 13px; font-weight: 600; color: #ffffff; }
.audio-sub { font-size: 11px; color: #aaaaaa; font-weight: 500; }

.equalizer { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
.eq-bar { width: 4px; background: var(--accent-green); border-radius: 2px; height: 4px; }
.playing .eq-bar { animation: wave 0.8s infinite ease-in-out alternate; }
.playing .eq-bar:nth-child(1) { animation-delay: 0.1s; }
.playing .eq-bar:nth-child(2) { animation-delay: 0.3s; }
.playing .eq-bar:nth-child(3) { animation-delay: 0.2s; }
.playing .eq-bar:nth-child(4) { animation-delay: 0.4s; }

@keyframes wave { 0% { height: 4px; } 100% { height: 18px; } }

.social-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
  max-width: 320px;
  margin-bottom: 25px;
}

.yt-btn, .tt-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: #ffffff;
  text-decoration: none;
  font-weight: 600;
  font-size: 13px;
  padding: 10px 12px;
  border-radius: var(--radius);
  width: 100%;
  min-width: 0;
  letter-spacing: 0.5px;
  border: 3px solid var(--border-color);
  box-shadow: var(--shadow-btn);
  transition: transform 0.1s, box-shadow 0.1s;
}

.yt-btn { background: #ff0000; }
.tt-btn { background: #000000; }

.yt-btn:active, .tt-btn:active { transform: translateY(4px); box-shadow: none; }

main { max-width: 800px; margin: 0 auto; padding: 10px 16px; }

.hero-title {
  text-align: center;
  font-size: clamp(24px, 6vw, 36px);
  font-weight: 700;
  margin: 4px 0;
  color: #ffffff;
  text-shadow: 2px 2px 0 var(--border-color), -1px -1px 0 var(--border-color), 1px -1px 0 var(--border-color), -1px 1px 0 var(--border-color), 1px 1px 0 var(--border-color);
}

.hero-sub {
  text-align: center;
  color: #ffffff;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 24px;
  text-shadow: 1px 1px 0 var(--border-color);
}

/* ===== Search wrap + Suggestions ===== */
.search-wrap { position: relative; margin-bottom: 20px; }

.search-box {
  background: var(--surface);
  border: 3px solid var(--border-color);
  border-radius: 30px;
  padding: 6px 6px 6px 18px;
  display: flex;
  align-items: center;
  box-shadow: var(--shadow-hard);
  margin-bottom: 0;
}
.search-box input { border: none; outline: none; width: 100%; font-family: inherit; font-size: 15px; color: var(--text-main); background: transparent; font-weight: 500; }
.search-box input::placeholder { color: var(--text-dim); }
.search-box button {
  background: var(--accent-yellow); border: 2px solid var(--border-color); color: var(--text-main);
  padding: 8px 20px; border-radius: 20px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
  box-shadow: 0 3px 0 var(--border-color); transition: transform .1s, box-shadow .1s;
}
.search-box button:active { transform: translateY(3px); box-shadow: none; }

.suggestions {
  position: absolute;
  top: calc(100% + 6px);
  left: 0; right: 0;
  background: var(--surface);
  border: 3px solid var(--border-color);
  border-radius: 16px;
  box-shadow: var(--shadow-hard);
  max-height: 300px;
  overflow-y: auto;
  z-index: 100;
  display: none;
  padding: 6px;
}
.suggestions.show { display: block; }
.suggestions .sug-item {
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
  transition: background .15s;
}
.suggestions .sug-item:hover,
.suggestions .sug-item.active { background: var(--accent-yellow); }

/* Ẩn nhãn GAME / HUB */
.suggestions .sug-type { display: none !important; }

.suggestions .sug-empty {
  padding: 12px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
}

.tags {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.tags button {
  width: 100%; min-width: 0; background: var(--surface); border: 3px solid var(--border-color);
  padding: 8px 6px; border-radius: 20px; font-family: inherit; font-size: 13px; font-weight: 700;
  color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 6px; line-height: 1.2; text-align: center; white-space: normal; word-break: break-word; overflow: hidden;
  box-shadow: 0 3px 0 var(--border-color); transition: transform .1s, box-shadow .1s, background .2s;
}
.tags button:active { transform: translateY(3px); box-shadow: none; }
.tags button.on { background: var(--accent-yellow); color: var(--text-main); }
.tags button span.dot { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 2px solid var(--border-color); }

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.card {
  background: var(--surface);
  border: 3px solid var(--border-color);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-hard);
  display: flex;
  flex-direction: column;
  transition: transform .1s, box-shadow .1s;
}
.card:active { transform: translateY(4px); box-shadow: none; }

.card-img-box {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #e0e0e0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  border-bottom: 3px solid var(--border-color);
}

.card-img-box::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, #d0d0d0 25%, #e8e8e8 50%, #d0d0d0 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite; z-index: 1; transition: opacity .35s ease;
}
.card-img-box.loaded::before { opacity: 0; pointer-events: none; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.card-img-box img {
  width: 100%; height: 100%; object-fit: cover; 
  object-position: top center;
  opacity: 0; transition: opacity .35s ease; position: relative; z-index: 2;
}
.card-img-box img.img-ready { opacity: 1; }

.card-img-placeholder {
  color: var(--text-main); font-weight: 700; font-size: 14px; letter-spacing: 0.5px;
  text-align: center; padding: 0 8px; position: relative; z-index: 2;
}

.card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; }

.card-title {
  font-size: 20px; 
  font-weight: 700; 
  margin: 0 0 12px 0; 
  color: var(--text-main); 
  line-height: 1.3;
  text-align: center;
}

.game-name { 
  color: #e63946; 
  font-weight: 600; 
  display: block; 
  margin-top: 6px; 
  font-size: 16px; 
}

.card-footer {
  margin-top: auto; display: flex; justify-content: space-between; align-items: center;
  gap: 6px; padding-top: 10px; border-top: 2px dashed rgba(0,0,0,0.1);
}

.btn-link {
  flex: 1; text-align: center; background: #ffffff; border: 2px solid var(--border-color);
  color: var(--text-main); text-decoration: none; font-weight: 700; font-size: 13px; padding: 8px 0;
  border-radius: 8px; transition: all .1s ease; display: flex; justify-content: center; align-items: center;
  box-shadow: 0 3px 0 var(--border-color);
}
.btn-link:active { transform: translateY(3px); box-shadow: none; background: #f0f0f0; }

.btn-sub { background: #f4f4f4; }

.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 30px; flex-wrap: wrap; }
.pagination button {
  background: #ffffff; border: 2px solid var(--border-color); padding: 8px 16px; border-radius: 10px;
  font-family: inherit; font-size: 14px; font-weight: 700; color: var(--text-main); cursor: pointer;
  box-shadow: 0 3px 0 var(--border-color); transition: all 0.1s ease;
}
.pagination button:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.pagination button.active { background: var(--accent-yellow); }
.pagination button:disabled { opacity: 0.5; cursor: not-allowed; background: #ddd; }

@media (max-width: 480px) {
  .tags { grid-template-columns: repeat(2, 1fr); }
  .grid { gap: 8px; }
  .card-body { padding: 10px 6px; }
  .card-title { font-size: 16px; } 
  .game-name { font-size: 14px; margin-top: 4px; }
  .btn-link { font-size: 11px; padding: 6px 0; }

  /* Badge nhỏ lại cho gọn trên điện thoại */
  .support-badge { width: 78px; top: 8px; right: 8px; gap: 4px; }
  .support-badge .support-text { font-size: 9px; padding: 2px 4px; border-radius: 6px; }
}

.card{animation:cardIn .35s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qr-top{max-width:460px;margin:0 auto;padding:18px 20px 0;display:flex;justify-content:center}.qr-top[hidden]{display:none}
.qr-card{display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:14px;color:var(--text-main);background:var(--surface);border:3px solid var(--border-color);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow-hard);cursor:zoom-in;transition:transform .15s,box-shadow .15s;animation:cardIn .4s cubic-bezier(.2,.8,.2,1) backwards}
.qr-card:hover{transform:translateY(-2px)}.qr-card:active{transform:translateY(2px);box-shadow:none}
.qr-card img{width:168px;height:168px;object-fit:contain;background:#fff;border:3px solid var(--border-color);border-radius:10px;display:block}
.qr-zoom{position:fixed;inset:0;z-index:998;background:rgba(30,40,55,.8);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;animation:fadeIn .18s ease-out}
.qr-zoom img{width:min(86vw,420px);background:#fff;border:4px solid var(--border-color);border-radius:16px;padding:10px;box-shadow:var(--shadow-hard)}
.ft{text-align:center;color:#fff;font-size:13px;font-weight:600;padding:8px 16px 0;text-shadow:1px 1px 0 var(--border-color)}
.ft button{font:inherit;font-size:12px;color:var(--text-main);background:var(--surface);border:2px solid var(--border-color);border-radius:20px;padding:3px 12px;margin-left:6px;cursor:pointer;box-shadow:0 2px 0 var(--border-color);transition:transform .12s}
.ft button:hover{transform:translateY(-1px)} .ft button:active{transform:translateY(2px);box-shadow:none}
#adm{display:none;position:fixed;inset:0;z-index:999;background:rgba(30,40,55,.72);overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#adm.on{display:block;animation:fadeIn .18s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.a-box{background:var(--surface);border:3px solid var(--border-color);border-radius:16px;box-shadow:var(--shadow-hard);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.a-login{max-width:360px;margin:14vh auto 0;padding:26px 22px;text-align:center}
.a-login h2{margin:0 0 4px;font-size:24px}.a-login p{margin:0 0 16px;color:var(--text-sub);font-size:14px}
.a-login.err{animation:shake .35s}
#adm input,#adm select,#adm textarea{font:inherit;font-size:14px;width:100%;padding:9px 12px;border:3px solid var(--border-color);border-radius:var(--radius);background:#fff;color:var(--text-main);outline:none}
#adm input:focus,#adm select:focus{border-color:var(--accent-yellow);box-shadow:0 0 0 3px rgba(255,202,58,.45)}
.a-btn{font:inherit;font-weight:600;font-size:13px;cursor:pointer;color:#fff;background:var(--accent-green);border:3px solid var(--border-color);border-radius:var(--radius);padding:8px 14px;box-shadow:var(--shadow-btn);transition:transform .1s,box-shadow .1s}
.a-btn:hover{transform:translateY(-1px)}.a-btn:active{transform:translateY(4px);box-shadow:none}
.a-btn.g{background:var(--surface-2);color:var(--text-main)}.a-btn.r{background:#e63946}.a-btn.s{padding:5px 10px;font-size:12px;box-shadow:0 3px 0 var(--border-color)}
.a-wrap{max-width:1040px;margin:18px auto;display:grid;grid-template-columns:200px 1fr;gap:14px;padding:0 12px}
.a-side{padding:12px;align-self:start;position:sticky;top:12px}
.a-side b{display:block;font-size:18px;margin:2px 6px 10px}
.a-side button{display:block;width:100%;text-align:left;font:inherit;font-weight:600;font-size:14px;padding:9px 12px;margin-bottom:6px;border:2px solid transparent;border-radius:10px;background:none;cursor:pointer;color:var(--text-main);transition:background .12s}
.a-side button:hover{background:#fff}.a-side button.on{background:var(--accent-yellow);border-color:var(--border-color)}
.a-main{padding:18px;min-width:0}.a-main h2{margin:0 0 14px;font-size:22px}
.a-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.a-stat{background:#fff;border:3px solid var(--border-color);border-radius:var(--radius);padding:12px}.a-stat i{font-style:normal;font-size:28px;font-weight:700;display:block}.a-stat span{font-size:12px;color:var(--text-sub)}
.a-bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}.a-bar em{flex:0 0 190px;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.a-bar div{height:12px;background:var(--accent-yellow);border:2px solid var(--border-color);border-radius:8px;min-width:4px}
.a-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.a-row label,.a-f label{font-size:12px;font-weight:600;color:var(--text-sub);display:block;margin:0 0 4px}.a-f{margin-bottom:10px}
.a-tb{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.a-tb input{flex:1;min-width:160px;width:auto}
.a-tbl{width:100%;border-collapse:collapse;font-size:13px}.a-tbl td{padding:8px 6px;border-bottom:2px dashed var(--surface-2);vertical-align:middle}
.a-tbl img{width:64px;height:36px;object-fit:cover;border-radius:6px;border:2px solid var(--border-color);background:#ddd;display:block}
.a-tbl small{color:var(--text-dim)}.a-acts{white-space:nowrap;text-align:right}.a-acts .a-btn{margin-left:4px}
.a-form{background:#fff;border:3px solid var(--border-color);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.a-note{font-size:13px;color:var(--text-sub);background:#fff6d6;border:2px solid var(--border-color);border-radius:10px;padding:10px 12px;margin:10px 0;line-height:1.5}
.a-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#aToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:1000;border:3px solid var(--border-color);animation:pop .2s}
@media(max-width:720px){.a-wrap{grid-template-columns:1fr}.a-side{position:static;display:flex;gap:6px;overflow-x:auto}.a-side b{display:none}.a-side button{white-space:nowrap;margin:0;width:auto}.a-row{grid-template-columns:1fr}.a-bar em{flex-basis:110px}.a-main{padding:14px}}
@media(prefers-reduced-motion:reduce){.card,#adm,#adm *,.a-box,#aToast{animation:none!important;transition:none!important}}
.nx{flex:0 0 auto;width:30px;height:30px;margin-right:8px;border-radius:50%;border:2px solid var(--border-color);background:#fff;color:var(--text-main);font-size:13px;line-height:1;cursor:pointer;box-shadow:0 2px 0 var(--border-color);transition:transform .1s}.nx:hover{transform:translateY(-1px)}.nx:active{transform:translateY(2px);box-shadow:none}.a-tbl small{word-break:break-all}:root{--e-out:cubic-bezier(.23,1,.32,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.avatar-wrapper{animation:popIn .5s var(--e-out) backwards}

  if(ytReady)return fn();ytQ.push(fn);

/* ============ Fast CDN rewrite + image resize ============ */
function fastCDN(url){
  if (!url) return url;

  const m = url.match(/^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/(.+)$/);
  if (m) {
    const [, user, repo, rest] = m;
    let branch, path;
    if (rest.startsWith('refs/heads/')) {
      const after = rest.slice(11);
      const s = after.indexOf('/');
      if (s !== -1) { branch = after.slice(0, s); path = after.slice(s + 1); }
    } else {
      const s = rest.indexOf('/');
      if (s !== -1) { branch = rest.slice(0, s); path = rest.slice(s + 1); }
    }
    if (branch && path) {
      return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${path}`;
    }
    return url;
  }

  if (/^https:\/\/i\.ibb\.co\//.test(url)) {
    return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=640&output=webp&q=75`;
  }

  return url;
}

    if(!session)return;
    sbSyncBusy=true;
    const {error}=await sb.from('duyuscript_data').upsert({id:'main',payload:cloudPayload(),updated_at:new Date().toISOString(),updated_by:session.user.id},{onConflict:'id'});
    sbSyncBusy=false;
    if(error) console.error('DuyuScript cloud sync:',error.message);
    else {sbHasRemoteData=true; console.info('DuyuScript đã đồng bộ Supabase');}
  },650);
}
async function loadCloudData(){
  if(!sb)return;
  const {data,error}=await sb.from('duyuscript_data').select('payload').eq('id','main').maybeSingle();
  if(error){console.warn('Không tải được dữ liệu Supabase:',error.message);return;}
  if(data && data.payload && Array.isArray(data.payload.scripts)){
    sbHasRemoteData=true; SCRIPTS=data.payload.scripts;
    CFG=Object.assign({},DEF_CFG,data.payload.cfg||{});
    try{localStorage.setItem('dv_scripts',JSON.stringify(SCRIPTS));localStorage.setItem('dv_cfg',JSON.stringify(CFG));}catch(e){}
    cats=['Tất Cả',...CFG.cats]; cat='Tất Cả'; applyCfg(); render();
  }
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}
{const o=LS('dv_scripts'); if(Array.isArray(o)) SCRIPTS=o;}
shuffle(SCRIPTS);

const dotColors = ['#ff4fa3', '#a855f7', '#38bdf8', '#ffca3a'];
const $ = id => document.getElementById(id);
let cat = 'Tất Cả';
let currentPage = 1;
const ITEMS_PER_PAGE = 20;
let cats = ['Tất Cả', ...CFG.cats];

/* ============ Fast image pipeline ============ */
let imgObserver;
if (typeof IntersectionObserver !== 'undefined') {
  imgObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const img = entry.target;
      const url = img.dataset.src;
      if (url && !img.src) {
        img.src = url;
        img.onload = () => {
          img.classList.add('img-ready');
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
        img.onerror = () => {
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
      }
      imgObserver.unobserve(img);
    }
  }, { rootMargin: '600px 0px', threshold: 0.01 });
} else {
  imgObserver = {
    observe: (img) => {
      const url = img.dataset.src;
      if (url && !img.src) {
        img.src = url;
        img.onload = () => {
          img.classList.add('img-ready');
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
        img.onerror = () => {
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
      }
    },
    unobserve: () => {}
  };
}

function primeFirstImages(count = 4) {
  const imgs = [...document.querySelectorAll('.card-img-box img[data-src]')].slice(0, count);
  imgs.forEach(img => {
    const url = img.dataset.src;
    if (!url) return;
    img.fetchPriority = 'high';
    img.removeAttribute('loading');
    img.src = url;
    img.onload = () => {
      img.classList.add('img-ready');
      const box = img.closest('.card-img-box');
      if (box) box.classList.add('loaded');
    };
    img.onerror = () => {
      const box = img.closest('.card-img-box');
      if (box) box.classList.add('loaded');
    };
    imgObserver.unobserve(img);
  });
}

/* ============ Render ============ */
function render(){
  const q = $('q').value.trim().toLowerCase();

  const filtered = SCRIPTS.filter(s =>
    (cat === 'Tất Cả' || s.c === cat) &&
    (!q || s.hub.toLowerCase().includes(q) || s.game.toLowerCase().includes(q))
  );

  const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const paginated = filtered.slice(start, start + ITEMS_PER_PAGE);

  $('tags').innerHTML = cats.map((c, i) => `
    <button class="${c === cat ? 'on' : ''}" onclick="changeCat('${c.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">
      <span class="dot" style="background:${dotColors[i % dotColors.length]}"></span>
      <span>${c}</span>
    </button>
  `).join('');

  $('list').innerHTML = paginated.map(s => `
    <div class="card">
      <div class="card-img-box">
        ${s.img
          ? `<img data-src="${fastCDN(s.img)}" alt="${s.hub}" decoding="async" loading="lazy" fetchpriority="low" width="640" height="360">`
          : `<div class="card-img-placeholder">SCRIPT ${s.c.toUpperCase()}</div>`}
      </div>
      <div class="card-body">
        <h2 class="card-title">
          ${s.hub} ${s.game ? `<span class="game-name">${s.game}</span>` : ''}
        </h2>
        <div class="card-footer">
          <a class="btn-link" href="${s.link}" target="_blank" rel="noopener">LINK CHÍNH</a>
          <a class="btn-link btn-sub" href="${s.subLink}" target="_blank" rel="noopener">LINK PHỤ</a>
        </div>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.card-img-box img[data-src]').forEach(img => imgObserver.observe(img));
  primeFirstImages(4);

  let pageButtons = '';
  if (totalPages > 1) {
    pageButtons += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">&larr; Trước</button>`;
    for (let p = 1; p <= totalPages; p++) {
      pageButtons += `<button class="${p === currentPage ? 'active' : ''}" onclick="changePage(${p})">${p}</button>`;
    }
    pageButtons += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Sau &rarr;</button>`;
  }
  $('pagination').innerHTML = pageButtons;
}

function changeCat(c) { cat = c; currentPage = 1; render(); hideSuggestions(); }
function changePage(p) { currentPage = p; render(); window.scrollTo({ top: 300, behavior: 'smooth' }); }

/* ============ Suggestions (autocomplete) ============ */
const inputEl = $('q');
const sugBox  = $('suggestions');
let sugItems = [];
let sugActiveIdx = -1;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hideSuggestions() {
  sugBox.classList.remove('show');
  sugBox.innerHTML = '';
  sugItems = [];
  sugActiveIdx = -1;
}

function showSuggestions(query) {
  const q = query.trim().toLowerCase();
  if (!q) { hideSuggestions(); return; }

  const gameSet = new Set();
  const hubSet  = new Set();
  SCRIPTS.forEach(s => {
    if (s.game && s.game.toLowerCase().includes(q)) gameSet.add(s.game);
    if (s.hub  && s.hub.toLowerCase().includes(q))  hubSet.add(s.hub);
  });

  sugItems = [
    ...[...gameSet].slice(0, 6).map(v => ({ type: 'Game', label: v })),
    ...[...hubSet ].slice(0, 6).map(v => ({ type: 'Hub',  label: v })),
  ];
  sugActiveIdx = -1;

  if (!sugItems.length) {
    sugBox.innerHTML = `<div class="sug-empty">Không có gợi ý — thử từ khóa khác</div>`;
    sugBox.classList.add('show');
    return;
  }

  sugBox.innerHTML = sugItems.map((it, i) => `
    <div class="sug-item" data-idx="${i}">
      <span class="sug-label">${esc(it.label)}</span>
    </div>
  `).join('');
  sugBox.classList.add('show');

  sugBox.querySelectorAll('.sug-item').forEach(el => {
    el.addEventListener('click', () => pickSuggestion(Number(el.dataset.idx)));
  });
}

function pickSuggestion(idx) {
  const it = sugItems[idx];
  if (!it) return;
  inputEl.value = it.label;
  cat = 'Tất Cả';
  currentPage = 1;
  render();
  hideSuggestions();
  inputEl.blur();
}

function highlightSuggestion(newIdx) {
  const nodes = sugBox.querySelectorAll('.sug-item');
  if (!nodes.length) return;
  sugActiveIdx = (newIdx + nodes.length) % nodes.length;
  nodes.forEach((n, i) => n.classList.toggle('active', i === sugActiveIdx));
  nodes[sugActiveIdx].scrollIntoView({ block: 'nearest' });
}

let renderTimeout;
inputEl.addEventListener('input', () => {
  if (inputEl.value.trim() !== '') cat = 'Tất Cả';
  currentPage = 1;
  clearTimeout(renderTimeout);
  renderTimeout = setTimeout(render, 150);
  showSuggestions(inputEl.value);
});

inputEl.addEventListener('keydown', (e) => {
  if (!sugBox.classList.contains('show')) {
    if (e.key === 'Enter' && inputEl.value.trim() !== '') {
      cat = 'Tất Cả'; currentPage = 1; render();
    }
    return;
  }
  if (e.key === 'ArrowDown') { e.preventDefault(); highlightSuggestion(sugActiveIdx + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); highlightSuggestion(sugActiveIdx - 1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (sugActiveIdx >= 0) pickSuggestion(sugActiveIdx);
    else { if (inputEl.value.trim() !== '') { cat = 'Tất Cả'; currentPage = 1; render(); } hideSuggestions(); }
  } else if (e.key === 'Escape') {
    hideSuggestions();
  }
});

$('go').addEventListener('click', () => {
  if (inputEl.value.trim() !== '') cat = 'Tất Cả';
  currentPage = 1;
  render();
  hideSuggestions();
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) hideSuggestions();
});

applyCfg();
render();
</script>

mus(){const T=CFG.tracks||[];return `<h2>Nhạc nền (${T.length})</h2><div class="a-note">Hỗ trợ <b>link YouTube</b> (youtube.com, youtu.be, shorts) và <b>link mp3 trực tiếp</b> (https://…/bai.mp3, hoặc ./bai.mp3 nếu để file cạnh index.html). Link Google Drive/Dropbox thường không phát được. Khách bấm nút ⏭ trên trình phát để chuyển bài.</div>
  <div class="a-form"><div class="a-row">${inp('mT','Tên bài','')}${inp('mU','Link YouTube hoặc mp3','')}</div><button class="a-btn" data-a="madd">+ Thêm bài</button></div>
  <table class="a-tbl">${T.map((t,i)=>`<tr><td><b>${esc(t.t)}</b><br><small>${ytId(t.u)?'YouTube':'MP3'} · ${esc(t.u)}</small></td><td class="a-acts"><button class="a-btn s g" data-a="mup" data-i="${i}" aria-label="Lên">↑</button><button class="a-btn s g" data-a="mdn" data-i="${i}" aria-label="Xuống">↓</button><button class="a-btn s r" data-a="mdel" data-i="${i}">Xoá</button></td></tr>`).join('')}</table>`},
sec(){return `<h2>Bảo mật tài khoản</h2>${inp('pNew','Mật khẩu Supabase mới (từ 8 ký tự)','','password')}<button class="a-btn" data-a="pw">Cập nhật mật khẩu</button>
  <div class="a-note">Đăng nhập được xác thực bởi Supabase Auth. Chỉ tài khoản Admin được cấp quyền trong chính sách RLS mới có thể ghi dữ liệu. Không bật đăng ký công khai.</div>`}};
const val=id=>$(id).value.trim(), sameOrigin=u=>/^https?:\/\//i.test(u);
function mSave(){SV('dv_cfg',CFG);applyCfg();panel();toast('Đã lưu')}
const ACT={
 madd(){const t=val('mT'),u=val('mU');if(!u)return toast('Nhập link nhạc');if(!ytId(u)&&!/^(https?:\/\/|\.\/)/i.test(u))return toast('Link phải là YouTube hoặc mp3 (http/https hoặc ./)');(CFG.tracks=CFG.tracks||[]).push({t:t||(ytId(u)?'Nhạc YouTube':'Nhạc nền'),u});mSave()},
 mdel(i){CFG.tracks.splice(i,1);mSave()},
 mup(i){i=+i;const T=CFG.tracks;if(i<1)return;[T[i-1],T[i]]=[T[i],T[i-1]];mSave()},
 mdn(i){i=+i;const T=CFG.tracks;if(i>=T.length-1)return;[T[i+1],T[i]]=[T[i],T[i+1]];mSave()},
 close:closeA,tab(i){tab=i;ed=null;panel()},view:closeA,async out(){sessionStorage.removeItem('dv_ok');if(sb)await sb.auth.signOut();closeA()},
 new(){ed={hub:'',game:'',c:'Tất Cả',link:'',subLink:'',img:''};panel()},cancel(){ed=null;panel()},
 edit(i){ed=Object.assign({},SCRIPTS.find(s=>s.id==i));panel()},
 del(i){if(!confirm('Xoá script này?'))return;SCRIPTS=SCRIPTS.filter(s=>s.id!=i);SV('dv_scripts',SCRIPTS);render();panel();toast('Đã xoá')},
 save(){const o={id:ed.id||Math.max(0,...SCRIPTS.map(s=>s.id))+1,hub:val('fHub'),game:val('fGame'),c:$('fC').value,link:val('fL'),subLink:val('fS'),img:val('fI')};
  if(!o.hub)return toast('Cần nhập tên Hub');if(!sameOrigin(o.link)||(o.subLink&&!sameOrigin(o.subLink)))return toast('Link phải bắt đầu bằng http(s)://');
  if(!o.subLink)o.subLink=o.link;const i=SCRIPTS.findIndex(s=>s.id===o.id);i<0?SCRIPTS.unshift(o):SCRIPTS[i]=o;ed=null;SV('dv_scripts',SCRIPTS);render();panel();toast('Đã lưu')},
 cadd(){const v=val('cNew');if(!v||v==='Tất Cả'||CFG.cats.includes(v))return toast('Tên không hợp lệ hoặc đã có');CFG.cats.push(v);SV('dv_cfg',CFG);cats=['Tất Cả',...CFG.cats];render();panel()},
 cren(i){const o=CFG.cats[i],n=(prompt('Tên mới:',o)||'').trim();if(!n||n===o||CFG.cats.includes(n))return;SCRIPTS.forEach(s=>{if(s.c===o)s.c=n});CFG.cats[i]=n;SV('dv_scripts',SCRIPTS);SV('dv_cfg',CFG);cats=['Tất Cả',...CFG.cats];cat='Tất Cả';render();panel()},
 cdel(i){const o=CFG.cats[i];if(!confirm('Xoá danh mục "'+o+'"? Script bên trong chuyển về "Tất Cả".'))return;SCRIPTS.forEach(s=>{if(s.c===o)s.c='Tất Cả'});CFG.cats.splice(i,1);SV('dv_scripts',SCRIPTS);SV('dv_cfg',CFG);cats=['Tất Cả',...CFG.cats];cat='Tất Cả';render();panel()},
 sset(){Object.assign(CFG,{name:val('sName')||'DuyuScript',title:val('sTitle'),sub:val('sSub'),yt:val('sYt'),tt:val('sTt'),avatar:val('sAv'),qr:val('sQr'),qrText:val('sQrT'),fx:$('sFx').value!=='off',fxl:$('sFx').value});SV('dv_cfg',CFG);applyCfg();toast('Đã lưu cài đặt')},
 exp(){const b=new Blob([JSON.stringify({scripts:SCRIPTS,cfg:CFG},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.json';a.click();URL.revokeObjectURL(a.href)},
 imp(){$('aFile').click()},
 rst(){if(!confirm('Xoá mọi thay đổi trên trình duyệt này?'))return;['dv_scripts','dv_cfg'].forEach(k=>localStorage.removeItem(k));location.reload()},
 async pw(){const n=$('pNew').value;if(!sb)return toast('Chưa cấu hình Supabase');if(n.length<8)return toast('Mật khẩu mới tối thiểu 8 ký tự');const {error}=await sb.auth.updateUser({password:n});if(error)return toast('Lỗi: '+error.message);$('pNew').value='';toast('Đã cập nhật mật khẩu Supabase')}
};
A.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.i)});
A.addEventListener('input',e=>{if(e.target.id==='aQ'){fq=e.target.value;const p=e.target.selectionStart;panel();const q=$('aQ');q.focus();q.setSelectionRange(p,p)}});
A.addEventListener('change',e=>{if(e.target.id!=='aFile')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.scripts))throw 0;SCRIPTS=d.scripts;CFG=Object.assign({},DEF_CFG,d.cfg||{});SV('dv_scripts',SCRIPTS);SV('dv_cfg',CFG);cats=['Tất Cả',...CFG.cats];applyCfg();render();panel();toast('Đã nhập dữ liệu')}catch(x){toast('File không hợp lệ')}};r.readAsText(f)});
A.addEventListener('change',e=>{if(e.target.id!=='sQrF')return;const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);$('sQr').value=c.toDataURL('image/png');toast('Đã nạp ảnh — bấm Lưu cài đặt')};im.src=URL.createObjectURL(f)});
$('qrBtn').addEventListener('click',()=>{const z=document.createElement('div');z.className='qr-zoom';z.innerHTML='<img alt="Mã QR ủng hộ" src="'+esc(CFG.qr)+'">';z.onclick=()=>z.remove();document.body.appendChild(z)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&A.classList.contains('on'))closeA()});
$('admBtn').addEventListener('click',openLogin);
if(location.hash==='#admin')openLogin();
window.addEventListener('hashchange',()=>{if(location.hash==='#admin')openLogin()});
$('yr').textContent=new Date().getFullYear();
/* Ưu tiên dữ liệu Supabase; data.json chỉ giữ làm phương án tương thích cũ khi chưa cấu hình Supabase. */
if(sb){sbLoadPromise=loadCloudData();}
else if(!LS('dv_scripts'))fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&Array.isArray(d.scripts)){SCRIPTS=d.scripts;if(!LS('dv_cfg'))CFG=Object.assign({},DEF_CFG,d.cfg||{});cats=['Tất Cả',...CFG.cats];shuffle(SCRIPTS);applyCfg();render()}}).catch(()=>{});
</script>
<div id="prog" aria-hidden="true"></div>
<div class="fab-wrap">
  <button class="fab" id="fabDon" type="button" aria-label="Donate (mã QR)">❤</button>
  <button class="fab show" id="fabRnd" type="button" aria-label="Script ngẫu nhiên">🎲</button>
  <button class="fab" id="fabTop" type="button" aria-label="Lên đầu trang">↑</button>
</div>
<script>
/* ============ Hiệu ứng & nút phụ ============ */
(function(){
const fd=$('fabDon'),fr=$('fabRnd'),ft=$('fabTop'),pg=$('prog'),q=$('q'),clr=$('clr');let tk=false;
function upd(){tk=false;const y=window.scrollY,h=document.documentElement.scrollHeight-innerHeight;pg.style.transform='scaleX('+(h>0?Math.min(1,y/h):0)+')';ft.classList.toggle('show',y>400)}
addEventListener('scroll',()=>{if(!tk){tk=true;requestAnimationFrame(upd)}},{passive:true});
const _a=applyCfg;
applyCfg=function(){_a();fd.classList.toggle('show',!!CFG.qr);document.documentElement.classList.toggle('no-fx',CFG.fx===false)};
applyCfg();upd();
fd.onclick=()=>$('qrBtn').click();
ft.onclick=()=>scrollTo({top:0,behavior:'smooth'});
fr.onclick=()=>{if(!SCRIPTS.length)return;const s=SCRIPTS[Math.floor(Math.random()*SCRIPTS.length)];q.value=s.game||s.hub;cat='Tất Cả';currentPage=1;render();hideSuggestions();clr.hidden=false;$('list').scrollIntoView({behavior:'smooth',block:'start'});toast('🎲 '+s.hub+(s.game?' — '+s.game:''))};
const sync=()=>{clr.hidden=!q.value};
q.addEventListener('input',sync);q.addEventListener('blur',sync);
clr.onclick=()=>{q.value='';currentPage=1;render();hideSuggestions();sync();q.focus()};
})();
</script>
<script>
/* ============ Hiệu ứng mạnh: nền bay, chữ nhảy, gợn sóng, tia sáng ============ */
(function(){
const H=document.documentElement,RM=matchMedia('(prefers-reduced-motion: reduce)');
const bg=document.createElement('div');bg.className='fx-bg';bg.setAttribute('aria-hidden','true');
for(let i=0;i<12;i++){const b=document.createElement('i'),s=14+Math.random()*34;b.className='bub';b.style.cssText='left:'+(Math.random()*100)+'%;width:'+s+'px;height:'+s+'px;--d:'+(10+Math.random()*10)+'s;--dl:-'+(Math.random()*14)+'s';bg.appendChild(b)}
document.body.prepend(bg);
function split(el,words){const t=el.textContent;el.setAttribute('aria-label',t);el.classList.add('wv');let i=0;
  el.innerHTML=(words?t.split(/(\s+)/):[...t]).map(p=>/^\s+$/.test(p)?p:'<span aria-hidden="true" style="--i:'+(i++)+'">'+esc(p)+'</span>').join('');
  el.classList.remove('wv-in');void el.offsetWidth;el.classList.add('wv-in');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('wv-in'),2400)}
const _b=applyCfg;
applyCfg=function(){_b();const L=CFG.fx===false?'off':(CFG.fxl||'strong');H.classList.toggle('no-fx',L==='off');H.classList.toggle('fx-strong',L==='strong');split($('pName'));split($('hTitle'),1)};
applyCfg();
document.addEventListener('pointerdown',e=>{
  if(!H.classList.contains('fx-strong')||RM.matches)return;
  const b=e.target.closest('.btn-link,.tags button,.pagination button,.yt-btn,.tt-btn,.search-box button,.fab,.audio-player-card');if(!b)return;
  if(!b.matches('.fab,.audio-player-card')){const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');s.className='rip';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';b.appendChild(s);setTimeout(()=>s.remove(),600)}
  for(let i=0;i<7;i++){const p=document.createElement('span'),a=Math.PI*2*i/7+Math.random()*.6,m=34+Math.random()*30;p.className='spk';p.textContent=['✦','★','✧','♥'][i%4];p.style.cssText='left:'+e.clientX+'px;top:'+e.clientY+'px;color:'+['#ffca3a','#ff4fa3','#38bdf8','#5cb85c'][i%4]+';--dx:'+Math.cos(a)*m+'px;--dy:'+Math.sin(a)*m+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),700)}
},{passive:true});
})();
</script>
</body></html>
